    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f15; color: white; }

    .nav-tabs { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 8px 4px; border: none; background: #2a2a3c; color: #aaa; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; }
    .tab-btn.active { background: #3b82f6; color: white; }
    .control { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #ccc; }
    input[type=range] { width: 100%; accent-color: #3b82f6; }
    #info { margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
    .state-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #333; margin-top: 5px; }
    .charge-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px; background: #444; }
    .btn-switch { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #dc2626; color: white; transition: 0.3s; }
    .btn-switch.on { background: #16a34a; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h2>Atomic Architect 3D</h2>
    
    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-atom" onclick="setViewMode('atom')">Átomo</button>
      <button class="tab-btn" id="btn-material" onclick="setViewMode('material')">Material</button>
      <button class="tab-btn" id="btn-circuit" onclick="setViewMode('circuit')">⚡ Circuito</button>
    </div>

    <!-- Controles Principais do Elemento -->
    <div id="panel-controls">
      <div class="control">
        <label>Protões (Z): <span id="p-val">29</span></label>
        <input type="range" id="protons" min="1" max="118" value="29">
      </div>
      <div class="control">
        <label>Neutrões: <span id="n-val">35</span></label>
        <input type="range" id="neutrons" min="0" max="180" value="35">
      </div>
      <div class="control">
        <label>Eletrões: <span id="e-val">29</span></label>
        <input type="range" id="electrons" min="0" max="118" value="29">
      </div>
      <div class="control">
        <label>Temperatura: <span id="temp-val">25</span> °C</label>
        <input type="range" id="temp" min="-273" max="3500" value="25">
      </div>
    </div>

    <!-- Painel Circuito Elétrico -->
    <div id="panel-circuit" style="display:none;">
      <div class="control">
        <button id="switch-btn" class="btn-switch" onclick="toggleCircuit()">Circuito Desligado ⭕</button>
      </div>
      <div class="control">
        <label>Voltagem (V): <span id="volt-val">0</span> V</label>
        <input type="range" id="volts" min="0" max="220" value="0">
      </div>
      <p style="font-size: 12px; color: #aaa;">Corrente Calculada: <b id="current-val" style="color:#60a5fa;">0.00 A</b></p>
    </div>

    <!-- Painel de Informações -->
    <div id="info">
      <h3 style="margin:0 0 5px 0;">
        <span id="elem-name" style="color:#60a5fa;">Cobre (Cu)</span>
        <span id="elem-charge" class="charge-badge">Neutro</span>
      </h3>
      <p style="margin: 3px 0; font-size: 13px;">Massa Atómica: <span id="elem-mass">63.546</span> u</p>
      <p style="margin: 3px 0; font-size: 13px;">Estado: <span id="elem-state" class="state-badge">Sólido</span></p>
    </div>
  </div>

      currentView = mode;

      document.getElementById('btn-circuit').classList.toggle('active', mode === 'circuit');

      document.getElementById('panel-circuit').style.display = (mode === 'circuit') ? 'block' : 'none';

      atomGroup.visible = (mode === 'atom');
      materialGroup.visible = (mode === 'material');
      circuitGroup.visible = (mode === 'circuit');

      isCircuitOn = !isCircuitOn;
      const btn = document.getElementById('switch-btn');
      btn.innerText = isCircuitOn ? "Circuito Ligado ⚡" : "Circuito Desligado ⭕";
      btn.classList.toggle('on', isCircuitOn);
      updateApp();
    }

    function buildCircuitView() {
      while(circuitGroup.children.length > 0){ circuitGroup.remove(circuitGroup.children[0]); }
      circuitElectrons = [];

      const wireGeo = new THREE.CylinderGeometry(1.2, 1.2, 10, 32);
      const wireMat = new THREE.MeshPhysicalMaterial({ color: 0xb87333, transparent: true, opacity: 0.4, roughness: 0.1 });
      const wire = new THREE.Mesh(wireGeo, wireMat);
      wire.rotation.z = Math.PI / 2;
      circuitGroup.add(wire);

      for(let i = 0; i < 40; i++) {
        const eMesh = new THREE.Mesh(electronGeo, matElectron);
        eMesh.position.set((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 1.8);
        circuitGroup.add(eMesh);
        circuitElectrons.push(eMesh);
      }
    }

    function updateApp() {
      let pCount = parseInt(document.getElementById('protons').value);

      // Regra genérica de protões para ajustar neutrões e eletrões automaticamente
      if (pCount !== lastProton) {
        lastProton = pCount;
        const autoNeutrons = Math.round(pCount * 1.3);
        document.getElementById('neutrons').value = autoNeutrons;
        document.getElementById('electrons').value = pCount;
      }

      const nCount = parseInt(document.getElementById('neutrons').value);
      const eCount = parseInt(document.getElementById('electrons').value);
      const temp = parseInt(document.getElementById('temp').value);
      const volts = parseInt(document.getElementById('volts').value);

      document.getElementById('p-val').innerText = pCount;
      document.getElementById('n-val').innerText = nCount;
      document.getElementById('e-val').innerText = eCount;
      document.getElementById('temp-val').innerText = temp;
      document.getElementById('volt-val').innerText = volts;

      const elemData = ELEMENTS_DB[pCount] || { name: `Elemento Z=${pCount}`, mass: pCount * 2, melt: 1000, boil: 2500, color: 0x888888, isGas: false, res: 100 };
      document.getElementById('elem-name').innerText = elemData.name;

      // Cálculo de Massa com base em Isótopos
      const isotopeMass = (pCount * 1.007) + (nCount * 1.008);
      document.getElementById('elem-mass').innerText = isotopeMass.toFixed(3);

      // Carga
      const charge = pCount - eCount;
      const chargeBadge = document.getElementById('elem-charge');
      if (charge === 0) {
        chargeBadge.innerText = "Neutro";
        chargeBadge.style.background = "#334155";
      } else if (charge > 0) {
        chargeBadge.innerText = `Íon (+${charge})`;
        chargeBadge.style.background = "#ef4444";
      } else {
        chargeBadge.innerText = `Íon (${charge})`;
        chargeBadge.style.background = "#3b82f6";
      }

      // Estado Físico
      const stateBadge = document.getElementById('elem-state');
      if (temp < elemData.melt) {
        stateBadge.innerText = "Sólido";
        stateBadge.style.background = "#15803d";
      } else if (temp >= elemData.melt && temp < elemData.boil) {
        stateBadge.innerText = "Líquido";
        stateBadge.style.background = "#b45309";
      } else if (temp >= elemData.boil && temp < 3000) {
        stateBadge.innerText = "Gás";
        stateBadge.style.background = "#2563eb";
      } else {
        stateBadge.innerText = "Plasma";
        stateBadge.style.background = "#b91c1c";
      }

      const amperes = isCircuitOn ? (volts / elemData.res).toFixed(2) : "0.00";
      document.getElementById('current-val').innerText = `${amperes} A`;

      // 1. RECONSTRUÇÃO DO ÁTOMO 3D
      while(atomGroup.children.length > 0){ atomGroup.remove(atomGroup.children[0]); }
      electronMeshes = [];

      const totalNucleus = pCount + nCount;
      const displayNucleus = Math.min(totalNucleus, 100);

      for (let i = 0; i < displayNucleus; i++) {
        const mesh = new THREE.Mesh(sphereGeo, i < (pCount * (displayNucleus/(totalNucleus||1))) ? matProton : matNeutron);
        const phi = Math.acos(-1 + (2 * i) / displayNucleus);
        const theta = Math.sqrt(displayNucleus * Math.PI) * phi;
        const r = 0.5 * Math.cbrt(displayNucleus);

        mesh.position.set(r * Math.cos(theta) * Math.sin(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(phi));
        atomGroup.add(mesh);
      }

      for (let i = 0; i < Math.min(eCount, 50); i++) {
        const electron = new THREE.Mesh(electronGeo, matElectron);
        const angle = (i / eCount) * Math.PI * 2;
        electron.userData = { angle: angle, radius: 3.5, speed: 0.03 + (isCircuitOn ? volts * 0.001 : 0) };
        atomGroup.add(electron);
        electronMeshes.push(electron);
      }

      // 2. RECONSTRUÇÃO DO MATERIAL 3D
      while(materialGroup.children.length > 0){ materialGroup.remove(materialGroup.children[0]); }

      let matColor = new THREE.Color(elemData.color);
      if (temp > elemData.melt && temp < elemData.boil) {
        matColor.lerp(new THREE.Color(0xff6600), 0.4);
      } else if (temp >= elemData.boil) {
        matColor.lerp(new THREE.Color(0xffcc00), 0.6);
      }

      const mat = new THREE.MeshPhysicalMaterial({
        color: matColor,
        roughness: elemData.isGas ? 0.9 : 0.2,
        metalness: elemData.isGas ? 0.0 : 0.85,
        clearcoat: 0.3
      });

      if (temp >= elemData.boil || elemData.isGas) {
        for(let i = 0; i < 35; i++) {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), mat);
          p.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
          materialGroup.add(p);
        }
      } else {
        const geom = (pCount === 6) ? new THREE.OctahedronGeometry(2, 0) : new THREE.DodecahedronGeometry(2, 0);
        materialMesh = new THREE.Mesh(geom, mat);
        materialGroup.add(materialMesh);
      }
    }

    document.getElementById('protons').addEventListener('input', updateApp);
    document.getElementById('neutrons').addEventListener('input', updateApp);
    document.getElementById('electrons').addEventListener('input', updateApp);
    document.getElementById('temp').addEventListener('input', updateApp);
    document.getElementById('volts').addEventListener('input', updateApp);

    setViewMode('atom');

    function animate() {
      requestAnimationFrame(animate);

      electronMeshes.forEach(el => {
        el.userData.angle += el.userData.speed;
        el.position.x = el.userData.radius * Math.cos(el.userData.angle);
        el.position.z = el.userData.radius * Math.sin(el.userData.angle);
      });

      if (currentView === 'circuit' && isCircuitOn) {
        const volts = parseInt(document.getElementById('volts').value);
        const speed = volts * 0.005;

        circuitElectrons.forEach(e => {
          e.position.x += speed;
          if (e.position.x > 4.5) e.position.x = -4.5;
        });
      }

      atomGroup.rotation.y += 0.005;
      if (materialGroup.visible) materialGroup.rotation.y += 0.008;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
